<!DOCTYPE html>
<html>
    <head><title>Upload</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }
        form p {
            margin-bottom: 20px;
        }
        form label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }
        form input,form select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }
        form input:focus,form select:focus {
            outline: none;
            border-color: #3498db;
        }
        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }
        .errorlist {
            color: #c0392b;
            font-size: 13px;
            padding-left: 20px;
            margin-top: 6px;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #256029;
            text-align: center;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2980b9;
        }
        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style></head>
    <body>
        <div class="container">
            <h1>Upload</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Upload</button>
            </form>
            <div class="footer">
                <a href="{% url 'profile' %}">Back to Profile</a>
            </div>
        </div>
    </body>
</html>
